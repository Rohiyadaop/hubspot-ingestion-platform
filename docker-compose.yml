services:
  api:
    build: .
    image: hubspot-ingestion:local
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-hubspot_ingestion}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      HMAC_SECRET: ${HMAC_SECRET:?Set HMAC_SECRET in .env}
      HUBSPOT_API_MODE: ${HUBSPOT_API_MODE:-hubspot}
      HUBSPOT_BASE_URL: ${HUBSPOT_BASE_URL:-https://api.hubapi.com}
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      DATA_DIR: /app/data
    volumes:
      - ingestion-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  mock-hubspot:
    image: hubspot-ingestion:local
    profiles: ["mock"]
    command: ["uvicorn", "mock_hubspot.server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hubspot_ingestion}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hubspot_ingestion"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: ["analytics"]
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_DB: hubspot
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""

  minio:
    image: minio/minio:latest
    profiles: ["analytics"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

volumes:
  postgres-data:
  ingestion-data: