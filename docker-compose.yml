version: "3.9"

services:
  mock-hubspot:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: >
      bash -lc "pip install -r requirements.txt && uvicorn mock_hubspot.server:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
    expose:
      - "9000"
    environment:
      CLICKHOUSE_DB: hubspot
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
